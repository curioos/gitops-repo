apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: dev-project
  namespace: argocd

spec:
  description: "Dev environment project"

  sourceRepos:
  - https://github.com/curioos/gitops-repo

  destinations:
  - namespace: dev
    server: https://kubernetes.default.svc

  clusterResourceWhitelist:
  - group: '*'
    kind: '*'

  namespaceResourceWhitelist:
  - group: '*'
    kind: '*'
